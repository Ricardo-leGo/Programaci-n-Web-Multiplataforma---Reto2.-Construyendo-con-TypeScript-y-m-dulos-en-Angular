<main class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full text-center space-y-8">
    
    <div class="relative">
      <h1 class="text-9xl font-extrabold text-blue-600/10 dark:text-blue-500/10 select-none">
        404
      </h1>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-6xl sm:text-7xl font-black text-gray-900 dark:text-white tracking-tight">
          404
        </span>
      </div>
    </div>

    <div class="space-y-3">
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white sm:text-3xl">
        ¡Página no encontrada!
      </h2>
      <p class="text-sm sm:text-base text-gray-500 dark:text-gray-400">
        Lo sentimos, la página que estás buscando no existe o ha sido movida a otra ubicación.
      </p>
    </div>

    
    <div class="pt-4">
      <a 
        [routerLink]="['/']" 
        class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 shadow-md hover:shadow-lg cursor-pointer"
      >
        <svg class="w-5 h-5 mr-2 -ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"/>
        </svg>
        Volver al Inicio
      </a>
    </div>

  </div>
</main>
