<main class="max-w-4xl mx-auto p-6">
  
  <h2 class="text-2xl font-bold mb-4 text-center">Editar Noticia</h2>

  @if (noticiaAEditar) {
    <app-create-form 
      [noticiaAEditar]="noticiaAEditar" 
      (onSubmitNoticia)="handleEditarNoticia($event)" 
    />
  } @else {
    <p class="text-red-500 text-center">Noticia no encontrada.</p>
  }

  <div class="pt-6 flex justify-center">
    <a 
      [routerLink]="['/']" 
      class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 shadow-md hover:shadow-lg cursor-pointer"
    >
      <svg class="w-5 h-5 mr-2 -ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"/>
      </svg>
      Volver al Inicio
    </a>
  </div>
</main>
